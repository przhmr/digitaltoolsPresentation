<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Herramientas Digitales para el E-Learning</title>
  
  <meta name="description" content="Presentación de postgrado sobre herramientas digitales aplicadas al e-learning.">
  <meta name="author" content="Ing. Dalia Rojas, Ing. Homer Perozo, Ing. Indiana Salas, Lic. Ruby Medina">

  <!-- Google Fonts for Modern Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- RevealJS Core Stylesheets -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/reveal.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/reveal.js/4.5.0/theme/black.min.css" id="theme">

  <!-- Startup Style Theme Customizations -->
  <style>
    :root {
      --bg-color: #031638;
      --bg-color-deep: #020a18;
      --text-color: #f8fafc;
      --primary-accent: #00f2fe; /* Glowing Cyan */
      --secondary-accent: #8b5cf6; /* Elegant Violet */
      --neon-pink: #ff007f; /* Accent Pink */
      --muted-text: #94a3b8;
      --glass-bg: rgba(10, 15, 30, 0.65);
      --glass-border: rgba(0, 242, 254, 0.12);
      --card-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.4);
      --tilt-x: 0px;
      --tilt-y: 0px;
    }

    html,
    body,
    .reveal-viewport {
      font-family: 'Inter', sans-serif !important;
      background:
        radial-gradient(circle at 18% 12%, rgba(0, 242, 254, 0.13) 0, rgba(0, 242, 254, 0) 28vw),
        radial-gradient(circle at 82% 78%, rgba(139, 92, 246, 0.12) 0, rgba(139, 92, 246, 0) 32vw),
        linear-gradient(145deg, var(--bg-color) 0%, #03112d 48%, var(--bg-color-deep) 100%) !important;
      background-color: var(--bg-color) !important;
      color: var(--text-color) !important;
      min-height: 100%;
    }

    body {
      overflow: hidden;
    }

    .reveal {
      font-family: 'Inter', sans-serif !important;
      color: var(--text-color) !important;
      background: transparent !important;
    }

    .reveal .backgrounds,
    .reveal .slide-background,
    .reveal .slide-background-content {
      background: transparent !important;
      background-color: transparent !important;
    }

    .reveal .slides {
      background: transparent !important;
    }

    /* Headings styling - Startup Keynote feel (Elegant & Refined) */
    .reveal h1, .reveal h2, .reveal h3, .reveal h4 {
      font-family: 'Outfit', sans-serif !important;
      font-weight: 800 !important;
      text-transform: none !important;
      letter-spacing: 0 !important;
      color: var(--text-color) !important;
    }

    /* Cinematic Product Launch Title with Shimmering Gradient Flow */
    .reveal h1 {
      font-size: 2.1em !important;
      line-height: 1.05 !important;
      background: linear-gradient(135deg, #ffffff 0%, var(--primary-accent) 25%, var(--secondary-accent) 50%, var(--primary-accent) 75%, #ffffff 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: none !important;
      margin-bottom: 10px !important;
      animation: titleShimmer 6s linear infinite, titlePulse 4s infinite alternate ease-in-out;
    }

    .reveal h2 {
      font-size: 1.4em !important;
      line-height: 1.1 !important;
      background: linear-gradient(135deg, var(--primary-accent) 0%, var(--secondary-accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px !important;
      border: none !important;
      padding-bottom: 0 !important;
      text-shadow: 0 0 15px rgba(0, 242, 254, 0.08) !important;
    }

    .reveal h3 {
      font-size: 0.9em !important;
      color: var(--primary-accent) !important;
      letter-spacing: 0 !important;
    }

    /* Glowing Glassmorphism Cards with Shimmering Border */
    .glass-card {
      background: linear-gradient(145deg, rgba(7, 20, 47, 0.86), rgba(5, 13, 31, 0.72));
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 18px;
      box-shadow: var(--card-shadow);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      overflow: hidden;
    }

    .glass-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 242, 254, 0.15), transparent);
      transition: all 0.6s ease;
      pointer-events: none;
    }

    .glass-card:hover::before {
      left: 150%;
    }

    .glass-card:hover {
      border-color: rgba(0, 242, 254, 0.5);
      box-shadow: 0 15px 50px 0 rgba(0, 242, 254, 0.25);
      transform: translateY(-8px) scale(1.02);
    }

    /* High-Impact Stat Blocks */
    .stat-number {
      font-family: 'Outfit', sans-serif;
      font-size: 1.8em;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary-accent) 0%, var(--secondary-accent) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      margin-bottom: 5px;
      letter-spacing: -0.05em;
    }

    .stat-label {
      font-size: 0.52em;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-color);
    }

    .stat-desc {
      font-size: 0.42em;
      color: var(--muted-text);
      line-height: 1.35;
      margin-top: 5px;
    }

    /* Grid Layouts - Startup Keynote */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
      align-items: stretch;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 20px;
      align-items: stretch;
    }

    .insight-strip {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 16px;
    }

    .mini-kpi {
      min-height: 84px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
      padding: 12px;
      border: 1px solid rgba(0, 242, 254, 0.14);
      border-radius: 8px;
      background: rgba(5, 13, 31, 0.58);
    }

    .mini-kpi strong {
      color: var(--primary-accent);
      font-size: 0.7em;
    }

    .mini-kpi span {
      color: var(--muted-text);
      font-size: 0.42em;
      line-height: 1.25;
    }

    .mini-kpi.with-icon {
      min-height: 116px;
      align-items: flex-start;
      text-align: left;
      background: linear-gradient(145deg, rgba(7, 20, 47, 0.86), rgba(5, 13, 31, 0.72));
      border-color: rgba(0, 242, 254, 0.18);
      box-shadow: var(--card-shadow);
      padding: 14px;
    }

    .mini-kpi.with-icon .mini-icon {
      font-size: 1.15em;
      line-height: 1;
      margin-bottom: 4px;
      filter: drop-shadow(0 0 10px rgba(0, 242, 254, 0.35));
    }

    .mini-kpi.with-icon strong {
      font-size: 0.58em;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .road-flow {
      position: relative;
      min-height: 230px;
      border-radius: 10px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 18%, rgba(0, 242, 254, 0.14), transparent 30%),
        linear-gradient(180deg, rgba(2, 8, 24, 0.96), rgba(4, 16, 42, 0.92));
      border: 1px solid rgba(0, 242, 254, 0.2);
    }

    .road-path {
      position: absolute;
      left: 50%;
      bottom: -14px;
      width: 58%;
      height: 94%;
      transform: translateX(-50%) perspective(420px) rotateX(58deg);
      transform-origin: bottom;
      background: linear-gradient(90deg, transparent 0 6%, rgba(0, 242, 254, 0.2) 6% 7%, rgba(12, 21, 47, 0.96) 7% 93%, rgba(0, 242, 254, 0.2) 93% 94%, transparent 94% 100%);
      clip-path: polygon(39% 0, 61% 0, 100% 100%, 0 100%);
      box-shadow: 0 0 35px rgba(0, 242, 254, 0.14);
    }

    .road-path::before {
      content: '';
      position: absolute;
      left: 50%;
      top: -30%;
      width: 4px;
      height: 160%;
      transform: translateX(-50%);
      background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.92) 0 20px, transparent 20px 42px);
      animation: roadDash 2.8s linear infinite;
    }

    .road-node {
      position: absolute;
      width: 132px;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid rgba(0, 242, 254, 0.32);
      background: rgba(3, 22, 56, 0.9);
      box-shadow: 0 0 24px rgba(0, 242, 254, 0.16);
      text-align: center;
      font-size: 0.42em;
      line-height: 1.2;
      color: #fff;
    }

    .road-node strong {
      display: block;
      color: var(--primary-accent);
      font-size: 1.08em;
      margin-bottom: 2px;
    }

    .road-node.start { left: 4%; bottom: 24px; }
    .road-node.middle { left: calc(50% - 66px); top: 64px; }
    .road-node.end { right: 4%; bottom: 24px; }

    .road-car {
      position: absolute;
      left: 50%;
      bottom: 16px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--primary-accent);
      box-shadow: 0 0 22px rgba(0, 242, 254, 0.85);
      animation: driveRoad 5.2s ease-in-out infinite;
    }

    .orbit-system {
      position: relative;
      min-height: 260px;
      border: 1px solid rgba(0, 242, 254, 0.12);
      border-radius: 8px;
      background: radial-gradient(circle at 50% 50%, rgba(0, 242, 254, 0.13), rgba(5, 13, 31, 0.55) 56%, rgba(5, 13, 31, 0.75));
      overflow: hidden;
    }

    .orbit-system::before,
    .orbit-system::after {
      content: '';
      position: absolute;
      inset: 15%;
      border: 1px solid rgba(0, 242, 254, 0.18);
      border-radius: 50%;
      animation: slowSpin 28s linear infinite;
    }

    .orbit-system::after {
      inset: 28%;
      border-color: rgba(139, 92, 246, 0.22);
      animation-duration: 18s;
      animation-direction: reverse;
    }

    .orbit-core,
    .orbit-node {
      position: absolute;
      display: grid;
      place-items: center;
      text-align: center;
      border-radius: 8px;
      border: 1px solid rgba(0, 242, 254, 0.28);
      background: rgba(3, 22, 56, 0.86);
      box-shadow: 0 0 24px rgba(0, 242, 254, 0.14);
      color: #fff;
      font-weight: 800;
    }

    .orbit-core {
      width: 130px;
      height: 82px;
      left: calc(50% - 65px);
      top: calc(50% - 41px);
      font-size: 0.48em;
      z-index: 2;
    }

    .orbit-node {
      width: 96px;
      min-height: 58px;
      font-size: 0.38em;
      line-height: 1.15;
      z-index: 3;
      animation: floatNode 5s ease-in-out infinite alternate;
    }

    .orbit-node:nth-child(2) { left: 8%; top: 16%; }
    .orbit-node:nth-child(3) { right: 7%; top: 16%; animation-delay: 0.8s; }
    .orbit-node:nth-child(4) { left: calc(50% - 48px); bottom: 8%; animation-delay: 1.4s; }

    .bar-chart {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: end;
      gap: 14px;
      height: 185px;
      padding: 16px 12px 10px;
      border-radius: 8px;
      border: 1px solid rgba(0, 242, 254, 0.14);
      background: linear-gradient(180deg, rgba(15, 23, 42, 0.72), rgba(3, 22, 56, 0.38));
    }

    .bar {
      --bar-height: 60%;
      position: relative;
      height: var(--bar-height);
      min-height: 28px;
      border-radius: 6px 6px 2px 2px;
      background: linear-gradient(180deg, var(--primary-accent), rgba(139, 92, 246, 0.72));
      box-shadow: 0 0 24px rgba(0, 242, 254, 0.22);
      transform-origin: bottom;
      animation: growBar 3.6s ease-out both;
    }

    .bar span {
      position: absolute;
      left: 50%;
      bottom: -26px;
      transform: translateX(-50%);
      color: var(--muted-text);
      font-size: 0.34em;
      white-space: nowrap;
    }

    .process-flow {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      align-items: stretch;
    }

    .flow-step {
      position: relative;
      min-height: 116px;
      padding: 14px 10px;
      border: 1px solid rgba(0, 242, 254, 0.18);
      border-radius: 8px;
      background: rgba(5, 13, 31, 0.7);
      overflow: hidden;
    }

    .flow-step::after {
      content: '';
      position: absolute;
      inset: -45%;
      width: 72%;
      height: 190%;
      background: linear-gradient(115deg, transparent 32%, rgba(255, 255, 255, 0.13) 48%, rgba(0, 242, 254, 0.08) 54%, transparent 68%);
      opacity: 0.2;
      transform: translate3d(calc(-18% + var(--tilt-x)), calc(-5% + var(--tilt-y)), 0) rotate(8deg);
      animation: subtleReflection 9s ease-in-out infinite;
      pointer-events: none;
    }

    .flow-step::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(circle at calc(50% + var(--tilt-x)) calc(12% + var(--tilt-y)), rgba(255, 255, 255, 0.07), transparent 42%);
      opacity: 0.18;
      pointer-events: none;
    }

    .flow-step strong {
      position: relative;
      z-index: 1;
      display: block;
      color: #fff;
      font-size: 0.58em;
      margin-bottom: 8px;
    }

    .flow-step span {
      position: relative;
      z-index: 1;
      display: block;
      color: var(--muted-text);
      font-size: 0.42em;
      line-height: 1.25;
    }

    .pulse-network {
      position: relative;
      min-height: 250px;
      border-radius: 8px;
      border: 1px solid rgba(139, 92, 246, 0.2);
      background:
        linear-gradient(90deg, rgba(0, 242, 254, 0.08) 1px, transparent 1px),
        linear-gradient(0deg, rgba(0, 242, 254, 0.08) 1px, transparent 1px),
        rgba(5, 13, 31, 0.68);
      background-size: 38px 38px;
      overflow: hidden;
    }

    .network-card {
      position: absolute;
      width: 118px;
      min-height: 58px;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid rgba(0, 242, 254, 0.26);
      background: rgba(3, 22, 56, 0.88);
      color: #fff;
      font-size: 0.4em;
      font-weight: 800;
      animation: floatNode 4.8s ease-in-out infinite alternate;
    }

    .network-card:nth-child(1) { left: 8%; top: 12%; }
    .network-card:nth-child(2) { right: 8%; top: 12%; animation-delay: 0.7s; }
    .network-card:nth-child(3) { left: 8%; bottom: 12%; animation-delay: 1.2s; }
    .network-card:nth-child(4) { right: 8%; bottom: 12%; animation-delay: 1.7s; }
    .network-card:nth-child(5) {
      left: calc(50% - 59px);
      top: calc(50% - 29px);
      border-color: rgba(139, 92, 246, 0.42);
      box-shadow: 0 0 34px rgba(139, 92, 246, 0.22);
    }

    .source-pipeline {
      display: grid;
      grid-template-columns: 0.9fr 1.2fr 0.9fr;
      align-items: center;
      gap: 12px;
      min-height: 220px;
    }

    .source-stack,
    .ai-output {
      display: grid;
      gap: 8px;
    }

    .source-chip,
    .output-chip {
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(0, 242, 254, 0.16);
      background: rgba(15, 23, 42, 0.7);
      color: #fff;
      font-size: 0.42em;
      font-weight: 800;
    }

    .ai-core {
      min-height: 150px;
      display: grid;
      place-items: center;
      text-align: center;
      border-radius: 50%;
      border: 1px solid rgba(0, 242, 254, 0.34);
      background: radial-gradient(circle, rgba(0, 242, 254, 0.18), rgba(139, 92, 246, 0.1) 55%, rgba(5, 13, 31, 0.8));
      color: #fff;
      font-size: 0.56em;
      font-weight: 900;
      animation: pulseCore 2.8s ease-in-out infinite;
    }

    .heat-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 14px;
    }

    .heat-pill {
      --fill: 80%;
      position: relative;
      overflow: hidden;
      min-height: 54px;
      display: flex;
      align-items: center;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(0, 242, 254, 0.14);
      background: rgba(5, 13, 31, 0.68);
      color: #fff;
      font-size: 0.42em;
      font-weight: 800;
    }

    .heat-pill::before {
      content: '';
      position: absolute;
      inset: 0 auto 0 0;
      width: var(--fill);
      background: linear-gradient(90deg, rgba(0, 242, 254, 0.22), rgba(139, 92, 246, 0.18));
      animation: fillHeat 1.2s ease-out both;
      z-index: -1;
    }

    /* Ultra-sleek, clean comparison table wrapper */
    .table-container {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: 16px;
      border: 1px solid var(--glass-border);
      background: rgba(10, 15, 30, 0.45);
      backdrop-filter: blur(12px);
      box-shadow: var(--card-shadow);
      margin-bottom: 10px;
    }

    .custom-table {
      width: 100%;
      border-collapse: collapse;
      border: none;
      font-size: 0.52em !important;
      margin: 0 !important;
    }

    .custom-table th {
      background: rgba(0, 242, 254, 0.08);
      color: var(--primary-accent) !important;
      font-weight: 800;
      text-transform: uppercase;
      font-size: 0.85em;
      letter-spacing: 0.08em;
      padding: 16px;
      border-bottom: 1px solid var(--glass-border);
    }

    .custom-table td {
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      color: var(--text-color);
      font-size: 0.85em;
      vertical-align: middle;
      line-height: 1.35;
    }

    .custom-table tr:hover {
      background: rgba(0, 242, 254, 0.04);
    }

    .custom-table tr:last-child td {
      border-bottom: none;
    }

    /* Slide specific adjustments */
    .reveal p {
      font-size: 0.65em;
      line-height: 1.45;
      color: var(--muted-text);
    }

    .reveal ul {
      margin-left: 15px !important;
    }

    .reveal li {
      margin-bottom: 8px;
      font-size: 0.60em;
      line-height: 1.4;
      color: #e2e8f0;
    }

    .reveal li strong {
      color: var(--primary-accent);
    }

    /* Ambient Canvas Backdrop - Perfectly Stationary to avoid black stripes */
    .glow-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
      background: linear-gradient(145deg, var(--bg-color) 0%, #03112d 52%, var(--bg-color-deep) 100%);
    }

    .glow-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.12;
      mix-blend-mode: screen;
      pointer-events: none;
    }

    .blob1 {
      top: -15%;
      left: -15%;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, var(--primary-accent) 0%, transparent 70%);
      animation: float-blob 20s infinite alternate ease-in-out;
    }

    .blob2 {
      bottom: -20%;
      right: -15%;
      width: 70vw;
      height: 70vw;
      background: radial-gradient(circle, var(--secondary-accent) 0%, transparent 70%);
      animation: float-blob 25s infinite alternate-reverse ease-in-out;
    }

    @keyframes float-blob {
      0% {
        transform: translate(0, 0) scale(1);
      }
      50% {
        transform: translate(8%, 12%) scale(1.15);
      }
      100% {
        transform: translate(-5%, -8%) scale(0.9);
      }
    }

    @keyframes titlePulse {
      0% {
        filter: drop-shadow(0 0 20px rgba(0, 242, 254, 0.1));
      }
      100% {
        filter: drop-shadow(0 0 45px rgba(0, 242, 254, 0.35));
      }
    }

    @keyframes titleShimmer {
      0% {
        background-position: 0% center;
      }
      100% {
        background-position: 200% center;
      }
    }

    @keyframes slowSpin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes floatNode {
      from {
        transform: translateY(0);
      }
      to {
        transform: translateY(-10px);
      }
    }

    @keyframes growBar {
      from {
        transform: scaleY(0.08);
        opacity: 0.45;
      }
      to {
        transform: scaleY(1);
        opacity: 1;
      }
    }

    @keyframes subtleReflection {
      0%, 100% {
        opacity: 0.12;
        transform: translate3d(calc(-22% + var(--tilt-x)), calc(-8% + var(--tilt-y)), 0) rotate(8deg);
      }
      50% {
        opacity: 0.2;
        transform: translate3d(calc(6% + var(--tilt-x)), calc(2% + var(--tilt-y)), 0) rotate(8deg);
      }
    }

    @keyframes pulseCore {
      0%, 100% {
        box-shadow: 0 0 18px rgba(0, 242, 254, 0.2);
        transform: scale(1);
      }
      50% {
        box-shadow: 0 0 44px rgba(0, 242, 254, 0.38);
        transform: scale(1.035);
      }
    }

    @keyframes subtleBounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-15px);
      }
    }

    @keyframes fillHeat {
      from {
        width: 0;
      }
      to {
        width: var(--fill);
      }
    }

    @keyframes roadDash {
      from { transform: translateX(-50%) translateY(0); }

    // Immediately render the presentation slides into the DOM

      document.documentElement.style.setProperty('--tilt-x', `${x.toFixed(1)}px`);
      document.documentElement.style.setProperty('--tilt-y', `${y.toFixed(1)}px`);
    };

    window.addEventListener('deviceorientation', event => {
      if (!window.matchMedia('(max-width: 768px)').matches) return;
      const gamma = Math.max(-12, Math.min(12, event.gamma || 0));
      const beta = Math.max(-12, Math.min(12, event.beta || 0));
      setFlowReflection(gamma * 0.55, beta * 0.25);
    }, { passive: true });

    // 3D Flowing Perspective Grid & Particle Stream Engine (Motion Graphics Background)
    const canvas = document.getElementById('network-canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

      width = canvas.width = window.innerWidth;

    let gridOffset = 0;
    let horizonY = height * 0.45; // Horizon height position (45% from top)
    let targetHorizonX = width * 0.5; // Slide transitions coordinate target
    let horizonX = width * 0.5; // Eased center of the 3D perspective grid

    // Bind perspective grid steering to horizontal slide transitions
    Reveal.on('slidechanged', event => {
      // Tilt/steer the perspective grid horizon based on active slide index
      // Keeps the canvas motion synchronized with Reveal's 3D-style transitions
      targetHorizonX = width * 0.5 - (event.indexh - 5) * 80;
    });

    // Particle class for 3D perspective flow
    const particles = [];
    const maxParticles = 35;

    class PerspectiveParticle {
      constructor() {
        this.reset();
        // Distribute initial depths randomly so they don't spawn all at once
        this.z = Math.random();
      }

      reset() {
        this.lane = Math.random(); // lane ratio from 0 to 1
        this.z = 0; // starts at the horizon
        this.speed = speed * (Math.random() * 0.6 + 0.7);
        // Soft Cyan or soft Purple/Violet to match previous colors
        this.color = Math.random() > 0.4 ? 'rgba(0, 242, 254, ' : 'rgba(139, 92, 246, ';
        this.size = Math.random() * 1.8 + 0.8;
      }

      update() {
        this.z += this.speed;
        if (this.z >= 1) {
          this.reset();
        }
      }

      draw() {
        if (this.z <= 0) return;

        // Exponential mapping for 3D perspective scaling
        const y = horizonY + Math.pow(this.z, 2.2) * (height - horizonY);
        // Radiate outward from the horizon center based on lane ratio
        const spread = (this.lane - 0.5) * 2.2; // -1.1 to 1.1 spread
        const x = horizonX + spread * width * 0.75 * Math.pow(this.z, 1.8);

        // Calculate size based on depth
        const r = this.size * (0.3 + this.z * 1.8);

        // Fade in near the horizon, fade out near the bottom
        let alpha = 1;
        if (this.z < 0.15) {
          alpha = this.z / 0.15;
        } else if (this.z > 0.8) {
          alpha = (1 - this.z) / 0.2;
        }
        alpha *= 0.35; // Maximum particle opacity (subtle and high-end)

        // Draw particle core
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fillStyle = this.color + alpha + ')';
        ctx.fill();

        // Draw particle glow halo
        ctx.beginPath();
        ctx.arc(x, y, r * 2.2, 0, Math.PI * 2);
        ctx.fillStyle = this.color + (alpha * 0.3) + ')';
        ctx.fill();
      }
    }

    // Initialize 3D Perspective Particles
    for (let i = 0; i < maxParticles; i++) {
      particles.push(new PerspectiveParticle());
    }

    function drawFlowingGrid() {
      ctx.clearRect(0, 0, width, height);

      // Smoothly ease the horizon center to make transitions incredibly fluid
      horizonX += (targetHorizonX - horizonX) * 0.04;

      const verticalLines = 18;
      const horizontalLines = 12;
      const bottomY = height;

      // 1. Draw Perspective Vertical Grid Lines (Road)
      ctx.lineWidth = 1.0;
      for (let i = 0; i <= verticalLines; i++) {
        const ratio = i / verticalLines;
        // Make the lines radiate from the horizon center to the bottom edge
        const bottomX = (ratio - 0.5) * width * 1.5 + horizonX;

        ctx.beginPath();
        ctx.moveTo(horizonX, horizonY);
        ctx.lineTo(bottomX, bottomY);
        
        // Extremely soft cyan-blue grid lines (premium and subtle)
        ctx.strokeStyle = 'rgba(0, 242, 254, 0.06)';
        ctx.stroke();
      }

      // 2. Draw Flowing Horizontal Perspective Lines (River flow)
      gridOffset += gridSpeed;
      if (gridOffset >= 40) gridOffset = 0;

      for (let i = 0; i < horizontalLines; i++) {
        const lineOffset = (i * 40 + gridOffset);
        const depthRatio = lineOffset / (horizontalLines * 40); // 0 to 1

        // Exponential mapping to simulate realistic 3D perspective spacing
        const y = horizonY + Math.pow(depthRatio, 2.2) * (height - horizonY);

        if (y > horizonY && y < height) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
          // Fade lines as they get closer to the horizon
          const alpha = Math.pow(depthRatio, 2) * 0.1;
          ctx.strokeStyle = `rgba(0, 242, 254, ${alpha})`;
          ctx.stroke();
        }
      }

      // 3. Draw a glowing vector horizon boundary line
      ctx.beginPath();
      ctx.moveTo(0, horizonY);
      ctx.lineTo(width, horizonY);
      ctx.strokeStyle = 'rgba(0, 242, 254, 0.12)';
      ctx.lineWidth = 1.2;
      ctx.stroke();

      // 4. Update and Draw Flowing 3D Particles
      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
      }

      requestAnimationFrame(drawFlowingGrid);
    }

    // Launch the Custom 3D Motion Graphics Grid Engine
    drawFlowingGrid();

    // Real-time slide preview message listener from editor.html
    window.addEventListener('message', event => {
      if (event.data && event.data.type === 'update-slides') {
        const newSlides = event.data.data;
        const activeIdx = event.data.activeIndex;
        
        // Re-render slides DOM dynamically
        renderSlides(newSlides);
        
        // Force Reveal.js to synchronize and layout the updated slides
        Reveal.sync();
        
        // Navigate instantly to the active slide being edited
        if (typeof activeIdx === 'number' && activeIdx >= 0) {
          Reveal.slide(activeIdx, 0);
        }
      }
    });

    // Automatically open the print dialog when ?print-pdf is in the URL
    if (window.location.search.match(/print-pdf/gi)) {
      // Delay slightly (1200ms) to ensure fonts, icons, and RevealJS layouts are fully rendered
      setTimeout(() => {
        window.print();
      }, 1200);
    }
  </script>
